services:
  postgres:
    image: postgres:16-alpine
    container_name: reuse-plus-postgres
    environment:
      POSTGRES_DB: reuseplus
      POSTGRES_USER: reuseplus
      POSTGRES_PASSWORD: reuseplus
    ports:
      - "5432:5432"
    volumes:
      - reuseplus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reuseplus -d reuseplus"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  reuseplus_pgdata:
