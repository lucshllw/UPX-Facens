services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reuseplus}
      POSTGRES_USER: ${POSTGRES_USER:-reuseplus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Execute node tools/setup-env.js antes de iniciar}
    volumes:
      - reuseplus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-reuseplus}
      DB_USER: ${POSTGRES_USER:-reuseplus}
      DB_PASSWORD: ${DB_PASSWORD:?Execute node tools/setup-env.js antes de iniciar}
      JWT_SECRET: ${JWT_SECRET:?Execute node tools/setup-env.js antes de iniciar}
      PORT: 8080
      UPLOAD_DIRECTORY: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - reuseplus_uploads:/app/uploads
volumes:
  reuseplus_pgdata:
  reuseplus_uploads:
