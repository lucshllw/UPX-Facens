name: Java + PostgreSQL + interface
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reuseplus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d reuseplus_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/reuseplus_test
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verificar interface e sincronizar distribuicao
        run: npm run check
      - name: Validar configuracao do Compose sem exibir credenciais
        run: |
          node tools/setup-env.js
          docker compose config --quiet
      - name: Testar Java, migracoes e fluxos no PostgreSQL real
        run: mvn -B -Ppostgres-it verify
      - name: Construir imagem de deploy
        run: docker build -t reuseplus:ci .
      - name: Iniciar imagem e verificar banco conectado
        env:
          JWT_SECRET: ci-only-not-for-production-random-key-with-at-least-sixty-four-bytes-2026
        run: |
          docker run -d --name reuseplus-ci --network host \
            -e DB_URL="$TEST_DB_URL" -e DB_USER="$TEST_DB_USER" -e DB_PASSWORD="$TEST_DB_PASSWORD" \
            -e JWT_SECRET reuseplus:ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/health; then
              curl --fail --silent http://127.0.0.1:8080/api/runtime
              exit 0
            fi
            sleep 2
          done
          docker logs reuseplus-ci
          exit 1
      - name: Relatorios de teste
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: testes-java-postgresql
          path: |
            target/surefire-reports/*.txt
            target/failsafe-reports/*.txt
