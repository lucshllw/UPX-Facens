spring:
  application:
    name: reuse-plus
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reuseplus}
    username: ${DB_USER:reuseplus}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 2KB
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml

app:
  upload-directory: ${UPLOAD_DIRECTORY:./.reuse-data/uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
